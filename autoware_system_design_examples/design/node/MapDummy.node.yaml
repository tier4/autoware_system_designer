autoware_system_design_format: 0.5.0

name: MapDummy.node

description: Dummy map node that publishes the vector and point cloud maps and serves partial/differential point cloud map requests.

package:
  name: autoware_system_dummy_modules
  provider: dummy

launch:
  plugin: autoware::system_dummy_modules::Mapping

# interfaces
subscribers: []

publishers:
  - name: vector_map
    message_type: autoware_map_msgs/msg/LaneletMapBin
    qos:
      reliability: reliable
      durability: transient_local
  - name: pointcloud_map
    message_type: sensor_msgs/msg/PointCloud2
    qos:
      reliability: reliable
      durability: transient_local

servers:
  - name: get_differential_pointcloud_map
    message_type: autoware_map_msgs/srv/GetDifferentialPointCloudMap
  - name: get_partial_pointcloud_map
    message_type: autoware_map_msgs/srv/GetPartialPointCloudMap

required_data:
  - entity: SampleMapDummy.data
    description: Map bundle providing the lanelet2 and pointcloud maps; the node reads its manifest for the file names.
    requires_paths:
      [
        lanelet2_map_path,
        pointcloud_map_path,
        pointcloud_map_metadata_path,
        map_projector_info_path,
      ]
    binding:
      param_values:
        - name: map_path
          from: bundle:path

param_files: []

param_values: []

# processes
processes:
  - name: export
    trigger_conditions:
      - once:
    outcomes:
      - to_output: vector_map
      - to_output: pointcloud_map
