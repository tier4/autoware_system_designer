autoware_system_design_format: 0.5.0

name: LidarMlDetector.node

description: Dummy ML-based LiDAR detector that loads an ML model bundle and produces detected objects from an input point cloud.

package:
  name: autoware_perception_dummy_nodes
  provider: dummy

launch:
  plugin: autoware::perception_dummy_nodes::LidarMlDetector
  executable: detector_a_node
  node_output: screen

# interfaces
subscribers:
  - name: pointcloud
    message_type: sensor_msgs/msg/PointCloud2

publishers:
  - name: objects
    message_type: autoware_perception_msgs/msg/DetectedObjects
    qos:
      reliability: reliable
      durability: transient_local

required_data:
  - entity: LidarCenterPointModel.data
    description: Lidar detection model bundle; the node reads its manifest for the engine file names.
    requires_version: { major: 4, min_minor: 1 }
    requires_paths:
      [encoder_onnx_path, head_onnx_path, class_remapper_param_path]
    binding:
      param_values:
        - name: model_path
          from: bundle:path

param_files:
  - name: node_param_path
    default: node_param.yaml
    schema: node_param.schema.json
    allow_substs: true

param_values:
  - name: build_only
    type: bool
    default: false
    description: If true, the node will only build the model and exit.

# processes
processes:
  - name: detector
    trigger_conditions:
      - or:
          - on_input: pointcloud
    outcomes:
      - to_output: objects
