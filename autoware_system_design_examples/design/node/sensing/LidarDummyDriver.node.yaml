autoware_system_design_format: 0.4.0

name: LidarDummyDriver.node

description: Dummy LiDAR driver that publishes a point cloud at a fixed rate.

package:
  name: autoware_system_dummy_modules
  provider: dummy

launch:
  plugin: autoware::system_dummy_modules::LidarDummyDriver

# interfaces
subscribers: []

publishers:
  - name: pointcloud
    message_type: sensor_msgs/msg/PointCloud2
    qos:
      reliability: best_effort
      durability: volatile

param_files: []

param_values:
  - name: composable_node
    type: bool
    default: false

# processes
processes:
  - name: lidar
    trigger_conditions:
      - periodic: 10.0 # Hz
        warn_rate: 5.0 # Hz
        error_rate: 1.0 # Hz
        timeout: 1.0 # s
    outcomes:
      - to_output: pointcloud
