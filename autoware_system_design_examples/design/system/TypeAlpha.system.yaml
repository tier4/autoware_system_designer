autoware_system_design_format: 0.5.0

name: TypeAlpha.system

description: Demo system Type Alpha - dummy sensing, map, localization, perception and planning components spread over main_ecu and dummy ECUs, with a simulation mode that swaps the perception module.

variables:
  - name: vehicle_id
    description: Identifier of the target vehicle, set by the deployment.
  - name: data_path

variable_files: []

modes:
  - name: default
    description: Default mode
    default: true
  - name: simulation
    description: Simulation mode

components:
  - name: lidar
    entity: LidarDummy.module
    path: /sensing/lidar
    compute_unit: main_ecu
  - name: map
    entity: MapDummy.node
    compute_unit: dummy_ecu_1
  - name: localization
    entity: LocalizationDummy.node
    compute_unit: dummy_ecu_1
  - name: object_recognition
    entity: PerceptionA.module
    description: LiDAR object recognition pipeline.
    path: /perception/object_recognition
    compute_unit: main_ecu
    parameter_set: [PerceptionModuleA.parameter_set]
  - name: planning
    entity: PlanningDummy.node
    compute_unit: dummy_ecu_2
  - name: ml_planner
    entity: MlPlanner_multi_step.node
    description: ML trajectory planner consuming the planner model bundle.
    path: /planning/ml_planner
    compute_unit: dummy_ecu_2
  - name: control
    entity: ControlDummy.node
    path: /control
    compute_unit: main_ecu
  - name: vehicle
    entity: VehicleDummy.node
    path: /vehicle
    compute_unit: main_ecu

node_groups:
  - name: pointcloud_container
    type: ros2_component_container_mt
    nodes:
      - /sensing/lidar/*
      - /perception/object_recognition/detector_a1/node_detector
      - /perception/object_recognition/detector_a2/node_detector
      - /perception/object_recognition/node_lidar_ml_detector

data:
  - name: ml_model_data
    entity: LidarCenterPointModel.data
    variant:
      - model_variant: base
    root: $(var data_path)/ml_models/
    consumers:
      - /perception/object_recognition/*
  - name: planner_model
    entity: MlPlannerModel.data
    variant:
      - model_release: latest
    root: $(var data_path)/ml_models/
    consumers:
      - /planning/ml_planner
  - name: map
    entity: SampleMapDummy.data
    variant:
      - location: sample-map-rosbag
    root: $(var data_path)/maps
    consumers:
      - /map
  - name: sensor_kit_calibration
    entity: SensorKitDummy.data
    variant:
      - vehicle_id: $(var vehicle_id)
    root: $(var data_path)/calibration
    consumers:
      - /vehicle

connections:
  - - object_recognition.subscriber.pointcloud
    - lidar.publisher.concatenated/pointcloud
  - - map.publisher.vector_map
    - planning.subscriber.lanelet_map
  - - object_recognition.publisher.objects
    - planning.subscriber.predicted_objects
  - - map.publisher.vector_map
    - ml_planner.subscriber.lanelet_map
  - - object_recognition.publisher.objects
    - ml_planner.subscriber.predicted_objects
  - - lidar.publisher.concatenated/pointcloud
    - localization.subscriber.pointcloud
  - - map.publisher.vector_map
    - localization.subscriber.lanelet_map
  - - object_recognition.subscriber.vector_map
    - map.publisher.vector_map
  - - localization.subscriber.twist
    - vehicle.publisher.twist
  - - localization.subscriber.imu
    - vehicle.publisher.imu
  # planning -> control -> vehicle
  - - control.subscriber.mission_planning/route
    - planning.publisher.mission_planning/route
  - - control.subscriber.kinematics
    - localization.publisher.kinematic_state
  - - control.subscriber.acceleration
    - localization.publisher.acceleration
  - - vehicle.subscriber.command/control_cmd
    - control.publisher.command/control_cmd
  - - vehicle.subscriber.command/gear_cmd
    - control.publisher.command/gear_cmd
  - - vehicle.subscriber.command/hazard_lights_cmd
    - control.publisher.command/hazard_lights_cmd
  - - vehicle.subscriber.command/turn_indicators_cmd
    - control.publisher.command/turn_indicators_cmd

# mode configuration
simulation:
  override:
    components:
      - name: object_recognition
        entity: PerceptionB.module
        path: /perception/object_recognition
        compute_unit: main_ecu
        parameter_set: [PerceptionModuleABuild.parameter_set]
    node_groups:
      - name: pointcloud_container
        type: ros2_component_container_mt
        nodes:
          - /sensing/lidar/*
          - /perception/object_recognition/detector_a1/node_detector
